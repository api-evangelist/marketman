aid: marketman
url: https://raw.githubusercontent.com/api-evangelist/marketman/refs/heads/main/apis.yml
name: MarketMan
kind: company
description: MarketMan is a cloud-based restaurant inventory and purchasing management
  platform (part of the Meal Ticket portfolio) for back-of-house operations - inventory
  counts, supplier catalogs, purchase orders, deliveries, invoices, recipes/menu costing,
  and POS sales. The MarketMan API V3 is a JSON REST API with separate Buyer and Vendor
  surfaces, token authentication, and webhooks for order events.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Restaurant
- Inventory
- Purchasing
- Supply Chain
- Food Service
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
